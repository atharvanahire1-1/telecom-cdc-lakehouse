  <!-- BACKGROUND                             -->
  <!-- ═══════════════════════════════════════ -->
  <rect width="1200" height="720" fill="#F4F7FA" rx="0"/>
  <!-- Subtle top gradient bar -->
  <rect width="1200" height="82" fill="#1B3A4B"/>
  <rect y="82" width="1200" height="1" fill="#E2E8F0"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- HEADER                                 -->
  <!-- ═══════════════════════════════════════ -->
  <text x="55" y="38" fill="#FFFFFF" font-size="22" font-weight="800" letter-spacing="1.5">TELECOM CDC LAKEHOUSE</text>
  <text x="55" y="62" fill="#94B8C8" font-size="12" font-weight="400">CDC streaming events · Apache Airflow orchestration · Amazon S3 data lake · Snowflake medallion warehouse</text>

  <!-- Status Badge -->
  <rect x="950" y="22" width="205" height="34" rx="17" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" filter="url(#badge-s)"/>
