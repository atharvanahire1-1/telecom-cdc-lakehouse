<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </radialGradient>
    <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-amber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="arrow-grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="arrow-grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.3"/>
    </linearGradient>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38BDF8"/>
    </marker>
    <marker id="arrowhead-cyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0284C7"/>
    </marker>
    <marker id="arrowhead-amber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B"/>
    </marker>
    <style>
      text { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bg-grad)" rx="12"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#94A3B8" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#94A3B8" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#94A3B8" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#94A3B8" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="#94A3B8" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke="#94A3B8" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="#94A3B8" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="500" stroke="#94A3B8" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="500" stroke="#94A3B8" stroke-width="0.5"/>
  </g>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" fill="#E2E8F0" font-size="18" font-weight="700" letter-spacing="2">TELECOM CDC LAKEHOUSE — ARCHITECTURE</text>
  <line x1="380" y1="52" x2="820" y2="52" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>

  <!-- ════════════════════════════════════════════ -->
  <!-- NODE 1: CDC Event Generator -->
  <!-- ════════════════════════════════════════════ -->
  <g filter="url(#card-shadow)">
    <rect x="30" y="120" width="200" height="240" rx="12" fill="#111827" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="30" y="120" width="200" height="4" rx="2" fill="#38BDF8"/>
  </g>
  <!-- Icon badge -->
  <circle cx="130" cy="165" r="22" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="130" y="160" text-anchor="middle" fill="#38BDF8" font-size="11" font-weight="600">⟨/⟩</text>
  <text x="130" y="173" text-anchor="middle" fill="#38BDF8" font-size="7" font-weight="500">PY</text>
  <!-- Labels -->
  <text x="130" y="205" text-anchor="middle" fill="#F1F5F9" font-size="13" font-weight="700">CDC Event</text>
  <text x="130" y="222" text-anchor="middle" fill="#F1F5F9" font-size="13" font-weight="700">Generator</text>
  <line x1="80" y1="232" x2="180" y2="232" stroke="#1E293B" stroke-width="1"/>
  <text x="130" y="252" text-anchor="middle" fill="#94A3B8" font-size="10">Python Mutations</text>
  <text x="130" y="268" text-anchor="middle" fill="#94A3B8" font-size="10">SQLite CDC Triggers</text>
  <text x="130" y="284" text-anchor="middle" fill="#94A3B8" font-size="10">JSONL Streaming</text>
  <!-- Stat chip -->
  <rect x="68" y="300" width="124" height="24" rx="12" fill="#38BDF810" stroke="#38BDF8" stroke-width="0.8"/>
  <text x="130" y="316" text-anchor="middle" fill="#38BDF8" font-size="10" font-weight="600">48,000+ Events</text>

  <!-- ════════════════════════════════════════════ -->
  <!-- ARROW 1→2 -->
  <!-- ════════════════════════════════════════════ -->
  <line x1="235" y1="240" x2="280" y2="240" stroke="url(#arrow-grad)" stroke-width="2" marker-end="url(#arrowhead-blue)" filter="url(#glow-blue)" opacity="0.85"/>

  <!-- ════════════════════════════════════════════ -->
  <!-- NODE 2: Airflow Orchestration -->
  <!-- ════════════════════════════════════════════ -->
  <g filter="url(#card-shadow)">
    <rect x="290" y="120" width="200" height="240" rx="12" fill="#111827" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="290" y="120" width="200" height="4" rx="2" fill="#0284C7"/>
  </g>
  <!-- Icon badge -->
  <circle cx="390" cy="165" r="22" fill="#0F172A" stroke="#0284C7" stroke-width="1.5"/>
  <text x="390" y="171" text-anchor="middle" fill="#0284C7" font-size="18">⟳</text>
  <!-- Labels -->
  <text x="390" y="205" text-anchor="middle" fill="#F1F5F9" font-size="13" font-weight="700">Airflow</text>
  <text x="390" y="222" text-anchor="middle" fill="#F1F5F9" font-size="13" font-weight="700">Orchestration</text>
  <line x1="340" y1="232" x2="440" y2="232" stroke="#1E293B" stroke-width="1"/>
  <text x="390" y="252" text-anchor="middle" fill="#94A3B8" font-size="10">Dockerized DAG</text>
  <text x="390" y="268" text-anchor="middle" fill="#94A3B8" font-size="10">6-Task Pipeline</text>
  <text x="390" y="284" text-anchor="middle" fill="#94A3B8" font-size="10">PythonOperator</text>
  <!-- Stat chip -->
  <rect x="328" y="300" width="124" height="24" rx="12" fill="#0284C710" stroke="#0284C7" stroke-width="0.8"/>
  <text x="390" y="316" text-anchor="middle" fill="#0284C7" font-size="10" font-weight="600">@daily Schedule</text>

  <!-- ════════════════════════════════════════════ -->
  <!-- ARROW 2→3 -->
  <!-- ════════════════════════════════════════════ -->
  <line x1="495" y1="240" x2="540" y2="240" stroke="url(#arrow-grad2)" stroke-width="2" marker-end="url(#arrowhead-cyan)" filter="url(#glow-blue)" opacity="0.85"/>

  <!-- ════════════════════════════════════════════ -->
  <!-- NODE 3: AWS S3 Staging -->
  <!-- ════════════════════════════════════════════ -->
  <g filter="url(#card-shadow)">
    <rect x="550" y="120" width="200" height="240" rx="12" fill="#111827" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="550" y="120" width="200" height="4" rx="2" fill="#F59E0B"/>
  </g>
  <!-- Icon badge -->
  <circle cx="650" cy="165" r="22" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="650" y="171" text-anchor="middle" fill="#F59E0B" font-size="16">☁</text>
  <!-- Labels -->
  <text x="650" y="205" text-anchor="middle" fill="#F1F5F9" font-size="13" font-weight="700">AWS S3</text>
  <text x="650" y="222" text-anchor="middle" fill="#F1F5F9" font-size="13" font-weight="700">Staging</text>
  <line x1="600" y1="232" x2="700" y2="232" stroke="#1E293B" stroke-width="1"/>
  <text x="650" y="252" text-anchor="middle" fill="#94A3B8" font-size="10">Partitioned Landing</text>
  <text x="650" y="268" text-anchor="middle" fill="#94A3B8" font-size="10">Env-Driven Creds</text>
  <text x="650" y="284" text-anchor="middle" fill="#94A3B8" font-size="10">Batch Upload</text>
  <!-- Stat chip -->
  <rect x="588" y="300" width="124" height="24" rx="12" fill="#F59E0B10" stroke="#F59E0B" stroke-width="0.8"/>
  <text x="650" y="316" text-anchor="middle" fill="#F59E0B" font-size="10" font-weight="600">raw/ Prefix</text>

  <!-- ════════════════════════════════════════════ -->
  <!-- ARROW 3→4 -->
  <!-- ════════════════════════════════════════════ -->
  <line x1="755" y1="240" x2="800" y2="240" stroke="url(#arrow-grad3)" stroke-width="2" marker-end="url(#arrowhead-amber)" filter="url(#glow-amber)" opacity="0.85"/>

  <!-- ════════════════════════════════════════════ -->
  <!-- NODE 4: Snowflake Medallion Lakehouse -->
  <!-- ════════════════════════════════════════════ -->
  <g filter="url(#card-shadow)">
    <rect x="810" y="80" width="360" height="340" rx="12" fill="#111827" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="810" y="80" width="360" height="4" rx="2" fill="#29B5E8"/>
  </g>
  <!-- Header -->
  <circle cx="990" cy="115" r="18" fill="#0F172A" stroke="#29B5E8" stroke-width="1.5"/>
  <text x="990" y="121" text-anchor="middle" fill="#29B5E8" font-size="14">❄</text>
  <text x="990" y="148" text-anchor="middle" fill="#F1F5F9" font-size="14" font-weight="700">Snowflake Medallion Lakehouse</text>
  <line x1="850" y1="160" x2="1130" y2="160" stroke="#1E293B" stroke-width="1"/>

  <!-- Bronze Sub-card -->
  <rect x="835" y="175" width="310" height="52" rx="8" fill="#1A1207" stroke="#B4530950" stroke-width="1"/>
  <rect x="835" y="175" width="4" height="52" rx="2" fill="#B45309"/>
  <circle cx="862" cy="201" r="10" fill="#B4530920" stroke="#B45309" stroke-width="1"/>
  <text x="862" y="205" text-anchor="middle" fill="#B45309" font-size="10" font-weight="700">B</text>
  <text x="885" y="196" fill="#D97706" font-size="12" font-weight="700">Bronze</text>
  <text x="885" y="214" fill="#92764A" font-size="10">Raw JSON (VARIANT) · Schema-on-Read</text>

  <!-- Silver Sub-card -->
  <rect x="835" y="238" width="310" height="52" rx="8" fill="#12151B" stroke="#94A3B840" stroke-width="1"/>
  <rect x="835" y="238" width="4" height="52" rx="2" fill="#94A3B8"/>
  <circle cx="862" cy="264" r="10" fill="#94A3B820" stroke="#94A3B8" stroke-width="1"/>
  <text x="862" y="268" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700">S</text>
  <text x="885" y="259" fill="#CBD5E1" font-size="12" font-weight="700">Silver</text>
  <text x="885" y="277" fill="#64748B" font-size="10">QUALIFY Dedup · Typed Cleanse · Deltas</text>

  <!-- Gold Sub-card -->
  <rect x="835" y="301" width="310" height="52" rx="8" fill="#1A1607" stroke="#FBBF2440" stroke-width="1"/>
  <rect x="835" y="301" width="4" height="52" rx="2" fill="#FBBF24"/>
  <circle cx="862" cy="327" r="10" fill="#FBBF2420" stroke="#FBBF24" stroke-width="1"/>
  <text x="862" y="331" text-anchor="middle" fill="#FBBF24" font-size="10" font-weight="700">G</text>
  <text x="885" y="322" fill="#FCD34D" font-size="12" font-weight="700">Gold</text>
  <text x="885" y="340" fill="#92874A" font-size="10">Star Schema · fact_churn_summary · BI</text>

  <!-- Medallion flow arrows inside card -->
  <text x="990" y="170" text-anchor="middle" fill="#475569" font-size="8" letter-spacing="6">▼   ▼   ▼</text>
  <text x="845" y="234" fill="#475569" font-size="8">▼</text>
  <text x="845" y="297" fill="#475569" font-size="8">▼</text>

  <!-- ════════════════════════════════════════════ -->
  <!-- Animated pulse dots on arrows -->
  <!-- ════════════════════════════════════════════ -->
  <circle r="3" fill="#38BDF8" opacity="0.9">
    <animateMotion dur="2s" repeatCount="indefinite" path="M235,240 L280,240"/>
  </circle>
  <circle r="3" fill="#0284C7" opacity="0.9">
    <animateMotion dur="2s" repeatCount="indefinite" path="M495,240 L540,240" begin="0.5s"/>
  </circle>
  <circle r="3" fill="#F59E0B" opacity="0.9">
    <animateMotion dur="2s" repeatCount="indefinite" path="M755,240 L800,240" begin="1s"/>
  </circle>

  <!-- ════════════════════════════════════════════ -->
  <!-- Bottom Pipeline Flow Labels -->
  <!-- ════════════════════════════════════════════ -->
  <text x="258" y="400" text-anchor="middle" fill="#475569" font-size="9">JSONL</text>
  <text x="258" y="412" text-anchor="middle" fill="#475569" font-size="9">Stream</text>
  <text x="518" y="400" text-anchor="middle" fill="#475569" font-size="9">boto3</text>
  <text x="518" y="412" text-anchor="middle" fill="#475569" font-size="9">Upload</text>
  <text x="778" y="400" text-anchor="middle" fill="#475569" font-size="9">COPY</text>
  <text x="778" y="412" text-anchor="middle" fill="#475569" font-size="9">INTO</text>

  <!-- Footer -->
  <line x1="100" y1="460" x2="1100" y2="460" stroke="#1E293B" stroke-width="0.8"/>
  <text x="30" y="482" fill="#475569" font-size="10">Atharva Nahire</text>
  <text x="300" y="482" fill="#475569" font-size="10">GitHub: atharvanahire1-1</text>
  <text x="620" y="482" fill="#475569" font-size="10">48,000+ CDC Records Processed</text>
  <text x="950" y="482" fill="#38BDF850" font-size="10">Python · Airflow · AWS S3 · Snowflake</text>
</svg>
